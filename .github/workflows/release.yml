name: Release

# Tag vX.Y.Z → a GitHub release whose template.lock asset (repo, ref, commit sha) is what
# config repos pin; their update check reads it. Nothing is published to a registry:
# each department builds the image into its own Azure Container Registry from that
# commit (scripts/build-image.zsh). The image build here is a check that it builds.
# A tag is released only if its commit is on main (reviewed and merged), and is marked
# Latest (what config repos' update checks offer) only if it is the highest vX.Y.Z tag.
on:
  push:
    tags: ["v*.*.*"]
  # Dry run: the build check only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history and every tag: the on-main and highest-version checks need them.
        with: {persist-credentials: false, fetch-depth: 0}
      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        id: tagcheck
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null \
            || { echo "::error::no origin/main in this checkout"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
            || { echo "::error::$TAG ($GITHUB_SHA) is not on main: merge it first, then tag the merged commit"; exit 1; }
          highest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" = "$TAG" ]; then latest=true; else latest=false; fi
          echo "$TAG is on main; highest release tag is $highest (latest=$latest)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The image builds (linux/amd64, as Container Apps runs it)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          platforms: linux/amd64
          push: false
          build-args: CHAT_TEMPLATE_SHA=${{ github.sha }}
      - name: Release with template.lock
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.tagcheck.outputs.latest }}
        run: |
          set -euo pipefail
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$TAG" --arg sha "$GITHUB_SHA" \
            '{repo: $repo, ref: $ref, sha: $sha}' > template.lock
          cat > notes.md <<EOT
          Pin this release in a config repo's \`template.lock\` (the weekly Update check does it for you):

          \`\`\`json
          $(cat template.lock)
          \`\`\`

          Each department's deploy builds the image into its own Azure Container Registry from commit \`${GITHUB_SHA}\` (\`scripts/build-image.zsh\`).
          EOT
          # An older line's patch release (v1.4.3 after v2.0.0) must not become "latest".
          [[ "$LATEST" == true || "$LATEST" == false ]] || { echo "::error::no latest decision"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest="$LATEST" template.lock
