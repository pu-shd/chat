name: Release image

# Tag vX.Y.Z → ghcr.io/pu-shd/chat:vX.Y.Z (linux/amd64 for Container Apps, arm64 for
# Macs), and a GitHub release whose notes carry the digest to pin in each config repo's
# template.lock. The GHCR package must be public so any department can pull it.
on:
  push:
    tags: ["v*.*.*"]
  # Dry run: build both platforms with the pinned actions, push/sign/release nothing.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign signature for the image

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Sign the image (keyless; deploys verify it)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Release notes with the pin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "no digest from the build"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY}:${TAG}@${DIGEST}"
          cat > notes.md <<EOT
          Image: \`${image}\`

          Pin it in a config repo's \`template.lock\`:

          \`\`\`json
          {"repo": "${GITHUB_REPOSITORY}", "ref": "${TAG}", "sha": "${GITHUB_SHA}", "image": "${image}"}
          \`\`\`
          EOT
          # Config repos' update check reads this asset to bump their template.lock.
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$TAG" --arg sha "$GITHUB_SHA" --arg image "$image" \
            '{repo: $repo, ref: $ref, sha: $sha, image: $image}' > template.lock
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag template.lock
