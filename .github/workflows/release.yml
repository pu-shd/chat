name: Release

# Tag vX.Y.Z → a GitHub release whose template.lock asset (repo, ref, commit sha) is what
# config repos pin; their update check reads it. Nothing is published to a registry:
# each department builds the image into its own Azure Container Registry from that
# commit (scripts/build-image.zsh). The image build here is a check that it builds.
on:
  push:
    tags: ["v*.*.*"]
  # Dry run: the build check only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The image builds (linux/amd64, as Container Apps runs it)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          platforms: linux/amd64
          push: false
          build-args: CHAT_TEMPLATE_SHA=${{ github.sha }}
      - name: Release with template.lock
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$TAG" --arg sha "$GITHUB_SHA" \
            '{repo: $repo, ref: $ref, sha: $sha}' > template.lock
          cat > notes.md <<EOT
          Pin this release in a config repo's \`template.lock\` (the weekly Update check does it for you):

          \`\`\`json
          $(cat template.lock)
          \`\`\`

          Each department's deploy builds the image into its own Azure Container Registry from commit \`${GITHUB_SHA}\` (\`scripts/build-image.zsh\`).
          EOT
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag template.lock
