# Dependabot covers what it can parse; tools/updates.py (update-check.yml) covers the rest:
# the Zulip image in image/Dockerfile (ARG + digest), the sidecar images in
# image/sidecars.json, and the bicep CLI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
    ignore:
      # cosign-installer v4 installs cosign 3 (new bundle format); pugwips' gateways.json
      # signatures are verified with cosign 2. Move deliberately.
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directories: [/tools, /tests]
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /tests
    schedule: {interval: weekly}
