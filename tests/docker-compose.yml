# Unit + integration tests in containers.
#   docker-compose -f tests/docker-compose.yml run --rm tests
# PostgreSQL here stands in for Azure Flexible Server: its admin is NOT a superuser.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: superuser-only-for-setup
    volumes:
      - ./pg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='chatadmin'\" | grep -q 1"]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAT_TEST_PGHOST: postgres
      CHAT_REQUIRE_INTEGRATION: "1"
